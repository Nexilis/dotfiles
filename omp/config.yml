modelRoles:
  default: google/gemini-3.7-flash
  slow: google/gemini-3.7-flash
  plan: "@default"
  vision: "@default"
  task: "@default"
  designer: "@default"
  smol: openrouter/z-ai/glm-5.3-flash
  tiny: "@smol"
  commit: "@smol"
  advisor: "@smol"
symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 2
composer:
  shape: box
disabledExtensions:
  - slash-command:ai-tooling-and-practices
  - slash-command:copyrights-report
  - slash-command:fibery-api
  - slash-command:frontend-slides
  - slash-command:googleworkspace-api
  - slash-command:handoff
  - slash-command:interview
  - slash-command:knowledge-hub
  - slash-command:monthly-kpis
  - slash-command:performance-review-architect
  - slash-command:product-management
  - slash-command:slack-cli
  - slash-command:team-gathering-organizer
defaultThinkingLevel: auto

retry:
  fallbackChains:
    # Model-selector keys follow the model, not the role, so every role
    # pointing at Flash is covered by the one chain. Same model over
    # OpenRouter first: a Google 503 is a capacity problem on that route,
    # not on the model.
    google/gemini-3.7-flash:
      - openrouter/google/gemini-3.7-flash
      - openrouter/google/gemini-3.6-flash
      - openrouter/z-ai/glm-5.3
    openrouter/z-ai/glm-5.3-flash:
      - openrouter/deepseek/deepseek-v4-flash
      - google/gemini-3.1-flash-lite
